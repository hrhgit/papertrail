[project]
name = "papertrail-relate"
version = "0.1.0"
description = "Local line history from coding agent sessions"
requires-python = ">=3.11"
dependencies = ["relate-db==1.1.0"]

[project.scripts]
papertrail = "papertrail.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "papertrail"
module-root = ""

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
